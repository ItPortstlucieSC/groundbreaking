*{box-sizing:border-box}
body{margin:0;background:#FBF8F2;color:#141414;font-family:'Proxima Nova',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0F3B3A;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.pg{width:100%;overflow:hidden;background:#FBF8F2}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.k{font:500 10.5px/1 'Druk Text Wide',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A6E5E}
.on-dark .k{color:#AAF6E6}
.h2{font:800 40px/1 'Ferryman',Georgia,serif;margin:14px 0 0;letter-spacing:-.005em;color:#141414}
.on-dark .h2{color:#FBF8F2}
.lead{font-size:16px;line-height:1.6;color:#5A5145;margin:14px 0 0;max-width:560px}
.on-dark .lead{color:rgba(251,248,242,.75)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:10px;font:800 12px/1 'Druk Text Wide',sans-serif;letter-spacing:.08em;text-transform:uppercase;border:none}
.btn-sea{background:#0F3B3A;color:#AAF6E6}
.btn-aq{background:#AAF6E6;color:#0F3B3A}
.btn-line{background:transparent;color:#141414;border:1.5px solid #141414}
.sec{padding:80px 0;position:relative}
.bg-con{background:#EDE5D6}
.bg-sea{background:#0F3B3A;color:#FBF8F2}
.plate-n{display:flex;align-items:center;justify-content:center;border-radius:10px;background:#0F3B3A;color:#AAF6E6;font:800 22px/1 'Druk Text Wide';flex-shrink:0}

/* NAV */
.util{height:36px;background:#0F3B3A;display:flex;align-items:center}
.util .wrap{width:100%;display:flex;align-items:center;justify-content:space-between}
.util a{font:600 11px/1 'Proxima Nova';letter-spacing:.06em;color:rgba(251,248,242,.8);text-transform:uppercase}
.util span{font:500 9px/1 'Druk Text Wide';letter-spacing:.14em;color:#AAF6E6;display:none}
.lang{display:flex;gap:2px}
.lang button{height:24px;padding:0 8px;border:none;border-radius:6px;background:transparent;color:rgba(251,248,242,.6);font:700 10.5px/1 'Proxima Nova';letter-spacing:.08em}
.lang button.is-on{background:#AAF6E6;color:#0F3B3A}
.nav{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.94);backdrop-filter:blur(14px);border-bottom:1px solid #E2D8C4}
.nav .wrap{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.lg{display:flex;align-items:center;gap:12px;color:#0F3B3A}
.lg-mark{width:48px;height:auto;flex-shrink:0}
.lg-word{display:flex;flex-direction:column;gap:3px}
.lg-word b{font:800 11.5px/1 'Druk Text Wide';letter-spacing:.06em;color:#141414;white-space:nowrap}
.lg-word span{font:800 11.5px/1 'Druk Text Wide';letter-spacing:.06em;color:#FF7A6B}
.nav-links{display:none}
.nav-r{display:flex;align-items:center;gap:8px}
.nav-r .btn{height:42px;padding:0 14px;font-size:10.5px}
.burger{width:44px;height:44px;border-radius:10px;border:1.5px solid #141414;background:transparent;color:#141414;font-size:16px}
.menu{background:#FBF8F2;border-bottom:1px solid #E2D8C4;padding:8px 20px 24px}
.menu a{display:flex;align-items:center;gap:14px;height:60px;border-bottom:1px solid #E2D8C4;font:800 17px/1 'Druk Text Wide';letter-spacing:.04em;color:#141414}
.menu a span{width:40px;height:40px;font-size:15px}

/* HERO */
.hero{position:relative;min-height:860px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.hero-bg{position:absolute;inset:-4%;background:url('assets/obra.webp') center/cover;filter:sepia(.3) saturate(1.2) hue-rotate(-8deg) brightness(1.05);animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.15) translate(-2%,1%)}}
.hero-glow{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,176,92,.45),rgba(255,120,72,.15) 55%,rgba(15,59,58,.45));mix-blend-mode:soft-light}
.hero-sc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(15,59,58,.55) 100%)}
.hero-hud{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:2}
.pill{background:rgba(251,248,242,.92);color:#141414;font:500 9.5px/1 'Druk Text Wide';letter-spacing:.14em;text-transform:uppercase;padding:9px 11px;border-radius:8px;display:flex;align-items:center;gap:7px}
.cta-l{display:none}
.pill.hide-m{display:none}
.pill i{width:7px;height:7px;border-radius:50%;background:#FF7A6B}
.hero-c{position:relative;z-index:2;padding-bottom:28px;display:flex;flex-direction:column;gap:18px}
.post{position:relative;background:#FBF8F2;border-radius:14px;padding:16px 16px 12px;box-shadow:0 22px 50px rgba(0,0,0,.35);transform:rotate(-2deg);align-self:flex-start;max-width:100%}
.post-pre{font:800 24px/1 'Ferryman',serif;color:#FF7A6B}
.post-big{white-space:nowrap;font:900 52px/.86 'Druk',sans-serif;letter-spacing:.01em;background:url('assets/aerial.webp') center/cover;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #0F3B3A;margin-top:4px}
.post-foot{display:flex;justify-content:space-between;gap:10px;padding-top:8px;font:500 8.5px/1.2 'Druk Text Wide';letter-spacing:.12em;text-transform:uppercase;color:#7A6E5E}
.stk{position:absolute;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.stk-luca{width:66px;height:66px;border-radius:50%;object-fit:cover;background:#FFD45C;border:4px solid #fff;right:-14px;top:-30px}
.stk-palm{width:46px;right:52px;top:-22px}
.hero-panel{background:#FBF8F2;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero-panel h1{margin:0;font:800 34px/1 'Ferryman',Georgia,serif;color:#141414}
.hero-panel h1 em{font-style:normal;color:#0F3B3A;background:linear-gradient(transparent 62%,#AAF6E6 62%)}
.hero-panel p{margin:0;font-size:15px;line-height:1.55;color:#5A5145}
.hero-ctas{display:flex;flex-direction:column;gap:8px;margin-top:4px}

/* COUNTDOWN */
.cd{padding:34px 0}
.cd .wrap{display:flex;flex-direction:column;gap:20px}
.cd-copy{display:flex;flex-direction:column;gap:8px}
.cd-copy b{font:800 22px/1.05 'Druk Text Wide';letter-spacing:.02em;color:#FBF8F2}
.cd-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cd-n{background:#0A2B2A;border-radius:10px;padding:14px 4px 12px;text-align:center;border:1px solid rgba(170,246,230,.18)}
.cd-n b{display:block;font:800 28px/1 'Druk Text Wide';color:#AAF6E6;font-variant-numeric:tabular-nums}
.cd-n span{display:block;margin-top:8px;font:500 8.5px/1 'Druk Text Wide';letter-spacing:.16em;color:rgba(251,248,242,.6);text-transform:uppercase}
/* countdown v3 · tira como la A, más grande */
.cd{padding:36px 0 34px}
.cd-nums{gap:0;border:1px solid rgba(170,246,230,.28);border-radius:8px;overflow:hidden;background:rgba(6,30,29,.55)}
.cd-n{background:transparent!important;border:0!important;border-right:1px solid rgba(170,246,230,.22)!important;border-radius:0!important;padding:18px 4px 14px}
.cd-n:last-child{border-right:0!important}
.cd-nums .cd-n{border-radius:0!important}
.cd-n b{font:900 78px/.88 'Druk',sans-serif;color:#AAF6E6;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.cd-n span{margin-top:10px;font:500 9px/1 'Druk Text Wide';letter-spacing:.18em;color:rgba(251,248,242,.6)}
.ticket{position:relative;background:#AAF6E6;color:#0F3B3A;border-radius:14px;display:flex;align-items:stretch;overflow:hidden;min-height:84px}
.ticket::before,.ticket::after{content:'';position:absolute;left:72%;width:22px;height:22px;border-radius:50%;background:var(--hole,#0F3B3A);margin-left:-11px}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.ticket .tk-a{flex:0 0 72%;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.ticket .tk-a span{font:500 9px/1 'Druk Text Wide';letter-spacing:.14em;text-transform:uppercase}
.ticket .tk-a b{font:800 17px/1.15 'Ferryman',serif}
.ticket .tk-b{flex-grow:1;display:flex;align-items:center;justify-content:center;border-left:2px dashed rgba(15,59,58,.35);font:800 15px/1 'Druk Text Wide'}

/* FACTS */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:32px}
.fact{background:#FFFFFF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:210px;border:1px solid #E2D8C4}
.fact-top{display:flex;align-items:center;justify-content:space-between}
.fact-top .plate-n{width:44px;height:44px;font-size:20px}
.fact .pict{width:40px;height:40px;border-radius:10px;background:#EDE5D6}
.fact .pict svg path,.fact .pict svg circle,.fact .pict svg rect{stroke:#0F3B3A}
.fact b{font:800 15px/1.15 'Druk Text Wide';letter-spacing:.02em}
.fact p{margin:0;font-size:13.5px;line-height:1.45;color:#5A5145;flex-grow:1}
.fact a{font:800 10px/1 'Druk Text Wide';letter-spacing:.1em;text-transform:uppercase;color:#FF7A6B}

/* PASSPORT */
.pass{margin-top:16px;background:#0F3B3A;color:#FBF8F2;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.pass-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pass-h b{font:800 26px/1 'Ferryman',serif}
.pass-h span{font:800 13px/1 'Druk Text Wide';color:#AAF6E6;white-space:nowrap}
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stamp{background:#FFFDF6;outline:5px dotted #0F3B3A;outline-offset:-2px;padding:7px;display:flex;flex-direction:column;gap:6px;color:#141414}
.stamp-in{border-radius:3px;display:flex;align-items:center;justify-content:center;height:62px;overflow:hidden}
.stamp-in img{height:48px!important}
.stamp>div:last-child{font-size:6.5px!important}
.stamp.todo{opacity:.4;filter:grayscale(1)}

/* SLIDER */
.cmp{position:relative;height:300px;margin-top:30px;overflow:hidden;border-radius:20px;user-select:none}
.cmp-a,.cmp-b{position:absolute;inset:0;background-size:cover;background-position:center}
.cmp-b{background-image:url('assets/aerial.webp');filter:sepia(.18) saturate(1.1) brightness(1.05)}
.cmp-a{background-image:url('assets/aerial-blueprint.webp')}
.cmp-line{position:absolute;top:0;bottom:0;width:3px;background:#FBF8F2;transform:translateX(-1.5px)}
.cmp-knob{position:absolute;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:12px;background:#AAF6E6;color:#0F3B3A;display:flex;align-items:center;justify-content:center;font:800 16px/1 'Proxima Nova';box-shadow:0 0 0 6px rgba(251,248,242,.6)}
.cmp-tag{position:absolute;top:12px;font:800 10px/1 'Druk Text Wide';letter-spacing:.14em;padding:9px 11px;border-radius:8px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.note{font-size:12px;color:#7A6E5E;margin-top:12px}

/* TOUR */
.tour-grid{display:flex;flex-direction:column;gap:20px;margin-top:30px}
.plan{position:relative;aspect-ratio:1612/784;border-radius:20px;background:url('assets/iso-night.webp') center/cover;margin-bottom:24%}
.plan::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(160deg,rgba(255,176,92,.28),rgba(15,59,58,.2));mix-blend-mode:soft-light;pointer-events:none}
.pin{position:absolute;z-index:2;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:9px;border:2px solid #FBF8F2;background:#0F3B3A;color:#AAF6E6;font:800 12px/1 'Druk Text Wide';display:flex;align-items:center;justify-content:center;transition:transform .2s;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.pin.is-on{background:#AAF6E6;color:#0F3B3A;transform:scale(1.15);box-shadow:0 0 0 8px rgba(170,246,230,.35)}
.luca{position:absolute;left:-1%;top:76%;width:25%;filter:drop-shadow(0 12px 20px rgba(0,0,0,.3));pointer-events:none;z-index:3}
.bubble{position:absolute;left:27%;top:calc(100% + 18px);background:#FFFFFF;color:#141414;font:700 13px/1.3 'Proxima Nova';padding:11px 14px;border-radius:14px 14px 14px 2px;max-width:66%;border:1px solid #E2D8C4}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex-shrink:0;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid #CDBFA6;background:#FFFFFF;color:#141414;font:800 10.5px/1 'Druk Text Wide';letter-spacing:.06em;text-transform:uppercase}
.chip.is-on{background:#0F3B3A;color:#AAF6E6;border-color:#0F3B3A}
.scard{background:#FFFFFF;border:1px solid #E2D8C4;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.scard-h{display:flex;align-items:center;gap:14px}
.scard-h .plate-n{width:58px;height:58px;font-size:24px}
.scard h3{margin:0;font:800 22px/1.05 'Druk Text Wide';letter-spacing:.02em;text-transform:uppercase}
.scard p{margin:0;font-size:14.5px;line-height:1.55;color:#5A5145}
.scard .ticket{--hole:#FFFFFF}
.tag{flex-shrink:0;font:500 8.5px/1 'Druk Text Wide';letter-spacing:.12em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:#FFD45C;color:#141414;align-self:flex-start}

/* WALL (light) */
.wall-stage{background:#DCD0B8!important;border:none!important}
.wall-world{background-color:#FBF8F2!important;background-image:radial-gradient(rgba(15,59,58,.14) 1.4px,transparent 1.4px)!important;box-shadow:inset 0 0 0 2px #CDBFA6,0 24px 60px rgba(60,40,10,.25)!important}
.wall-vig{box-shadow:inset 0 0 50px 14px #DCD0B8!important}
.hud-pill{background:rgba(251,248,242,.94)!important;color:#141414!important;border-color:#CDBFA6!important}
.hud-pill b{color:#0F3B3A!important}
.hud button{background:#FBF8F2!important;color:#141414!important;border-color:#CDBFA6!important;border-radius:10px!important}
.card{box-shadow:0 8px 20px rgba(60,40,10,.22)!important}
.card.staff,.wsel-card.staff{background:#0F3B3A!important}
.wnav button{border-color:#141414!important;color:#141414!important;border-radius:10px!important;font-family:'Druk Text Wide'!important;font-size:10.5px!important}
.flag{font-size:13px;line-height:1.45;color:#5A5145;padding-left:14px;border-left:3px solid #FF7A6B}
.wall-foot{display:flex;flex-direction:column;gap:14px;margin-top:20px}

/* SHOVEL */
.sh-grid{display:flex;flex-direction:column;gap:16px;margin-top:30px}
.sh-map{position:relative;aspect-ratio:800/560;border-radius:20px;overflow:hidden;border:1px solid #E2D8C4}
.sh-map svg{position:absolute;inset:0;width:100%;height:100%}
.ping{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#FF7A6B}
.ping::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid #FF7A6B;animation:pg 1.8s ease-out infinite}
@keyframes pg{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.maptag{position:absolute;transform:translate(calc(-100% - 12px),-30px);background:#FF7A6B;color:#141414;font:800 9.5px/1 'Druk Text Wide';letter-spacing:.08em;padding:7px 9px;border-radius:7px;white-space:nowrap;text-transform:uppercase}
.sh-now{background:#0F3B3A;color:#FBF8F2;border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center}
.sh-now .plate-n{width:56px;height:56px;background:#AAF6E6;color:#0F3B3A;font-size:22px}
.sh-now b{display:block;font:800 18px/1.1 'Druk Text Wide';margin-top:6px}
.sh-now small{display:block;margin-top:6px;font-size:12.5px;color:rgba(251,248,242,.7)}
.stops{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E2D8C4;border-radius:16px;padding:4px 16px}
.stop{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #EDE5D6}
.stop:last-child{border-bottom:none}
.stop .plate-n{width:30px;height:30px;font-size:11px}
.stop.next .plate-n{background:#EDE5D6;color:#7A6E5E}
.stop div{display:flex;flex-direction:column;gap:3px;flex-grow:1}
.stop b{font:700 14px/1.2 'Proxima Nova'}
.stop span{font-size:12px;color:#7A6E5E}
.stop a{font:800 9.5px/1 'Druk Text Wide';letter-spacing:.08em;text-transform:uppercase;color:#FF7A6B}

/* DIARY v2 · coming soon en blanco y negro (idea de la versión A) */
.diary2{position:relative;margin-top:30px;height:320px;border-radius:8px;overflow:hidden;display:flex;align-items:flex-end;background:#0B2A2A}

.crop2{position:absolute;z-index:2;width:18px;height:18px;border-color:#AAF6E6;border-style:solid}
.crop2.tl{left:14px;top:14px;border-width:2px 0 0 2px}.crop2.tr{right:14px;top:14px;border-width:2px 2px 0 0}
.crop2.bl{left:14px;bottom:14px;border-width:0 0 2px 2px}.crop2.br{right:14px;bottom:14px;border-width:0 2px 2px 0}
.d2-c{position:relative;z-index:2;padding:26px 24px;display:flex;flex-direction:column;gap:10px;color:#FBF8F2}
.d2-c b{font:900 52px/.86 'Druk',sans-serif;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.d2-c .t{font-size:14px;line-height:1.5;color:rgba(251,248,242,.78);max-width:460px}
@media (min-width:900px){

/* BENTO · essentials */
.bento{display:grid;grid-template-columns:1fr;gap:12px;margin-top:30px}
.bx{position:relative;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;color:#141414;min-height:230px;transition:transform .2s}
.bx:hover{transform:translateY(-2px)}
.bx-in{position:relative;z-index:2;padding:20px;display:flex;flex-direction:column;gap:10px;flex-grow:1}
.bx-gate{font:800 10px/1 'Druk Text Wide';letter-spacing:.14em;text-transform:uppercase;color:#0E8C79}
.bx-t{font:800 20px/1.05 'Druk Text Wide';text-transform:uppercase;letter-spacing:.01em}
.bx p{margin:0;font-size:14px;line-height:1.5;color:#5A5145;max-width:420px}
.bx-go{margin-top:auto;font:800 10.5px/1 'Druk Text Wide';letter-spacing:.1em;text-transform:uppercase;color:#0E8C79}
.bx-what{background:#0B2A2A;color:#FBF8F2;min-height:380px}
.bx-what .bx-img{position:absolute;inset:0;background:url('assets/iso-night.webp') 60% center/cover}
.bx-what::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,42,42,.15) 0%,rgba(11,42,42,.55) 45%,rgba(11,42,42,.96) 100%);z-index:1}
.bx-what .bx-in{justify-content:flex-end}
.bx-what .bx-gate,.bx-what .bx-go{color:#AAF6E6}
.bx-what p{color:rgba(251,248,242,.78)}
.bx-what .bx-go{margin-top:6px}
.bx-num{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.bx-num b{font:800 58px/.9 'Druk Text Wide';color:#AAF6E6;letter-spacing:-.01em}
.bx-num span{font:800 14px/1 'Druk Text Wide';text-transform:uppercase;letter-spacing:.08em}
.bx-where{background:#FFFFFF;border:1px solid #DCD4C6}
.bx-map{position:relative;height:170px;overflow:hidden;border-bottom:1px solid #DCD4C6}
.bx-map svg{position:absolute;inset:0;width:100%;height:100%}
.bx-pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#0F3B3A;box-shadow:0 0 0 6px rgba(15,59,58,.18)}
.bx-when{background:#0F3B3A;color:#FBF8F2}
.bx-when .bx-gate,.bx-when .bx-go{color:#AAF6E6}
.tl3{display:flex;flex-direction:column;gap:14px;margin:6px 0 8px}
.tl3-bar{height:6px;border-radius:3px;background:rgba(170,246,230,.18);overflow:hidden}
.tl3-bar span{display:block;height:100%;background:#AAF6E6}
.tl3-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tl3-steps div{display:flex;flex-direction:column;gap:5px}
.tl3-steps i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(170,246,230,.6)}
.tl3-steps .is-next i{background:#AAF6E6;border-color:#AAF6E6;box-shadow:0 0 0 5px rgba(170,246,230,.2)}
.tl3-steps b{font:800 15px/1.1 'Druk Text Wide';color:#FBF8F2}
.tl3-steps span{font-size:12px;line-height:1.35;color:rgba(251,248,242,.7)}
.bx-temp{background:#E9D4A7}
.bx-temp .bx-gate,.bx-temp .bx-go{color:#5C4A24}
.bx-temp p{color:#5C4A24}
.chip-temp{align-self:flex-start;font:800 9px/1 'Druk Text Wide';letter-spacing:.12em;text-transform:uppercase;padding:7px 9px;border-radius:6px;background:#141414;color:#E9D4A7}
@media (min-width:900px){
  .bento{grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:52px}
  .bx-what{grid-column:span 7;grid-row:span 2;min-height:560px}
  .bx-where{grid-column:span 5}
  .bx-temp{grid-column:span 5;order:3}
  .bx-when{grid-column:span 12;order:4;min-height:0}
  .bx-when .bx-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-areas:"g tl" "t tl" "go tl";column-gap:64px;row-gap:12px;align-items:start;padding:34px 34px 30px}
  .bx-when .bx-gate{grid-area:g}.bx-when .bx-t{grid-area:t}.bx-when .bx-go{grid-area:go;margin-top:6px}
  .bx-when .tl3{grid-area:tl;align-self:center;margin:0;gap:20px}
  .bx-when .tl3-steps b{font-size:30px}
  .bx-when .tl3-steps span{font-size:14px}
  .bx-what{order:1}.bx-where{order:2}
  .bx-in{padding:26px}
  .bx-t{font-size:28px}
  .bx-num b{font-size:110px}
  .bx-map{height:200px}
  .tl3-steps b{font-size:20px}
}
/* wall · tablero oscuro */
.wall-stage{background:#0B2A2A!important}
.wall-world{background-color:#123B3B!important;background-image:radial-gradient(rgba(170,246,230,.13) 1.4px,transparent 1.4px)!important;box-shadow:inset 0 0 0 2px rgba(170,246,230,.22),0 24px 60px rgba(0,0,0,.45)!important}
.wall-vig{box-shadow:inset 0 0 50px 14px #0B2A2A!important}
.hud-pill{background:rgba(11,42,42,.88)!important;color:#FBF8F2!important;border-color:rgba(170,246,230,.25)!important}
.hud-pill b{color:#AAF6E6!important}
.hud button{background:rgba(11,42,42,.88)!important;color:#FBF8F2!important;border-color:rgba(170,246,230,.3)!important}
.card{box-shadow:0 10px 26px rgba(0,0,0,.42)!important}
.card.staff,.wsel-card.staff{background:#0B2A2A!important}
/* shovel · números legibles */
.stop{gap:14px;padding:14px 0}
.stop .plate-n{width:40px;height:40px;border-radius:50%!important;background:#0F3B3A;color:#FFFFFF;font:700 16px/1 'Proxima Nova'}
.stop.next .plate-n{background:#FFFFFF;color:#0F3B3A;border:2px dashed #0F3B3A}
.stop b{font-size:15px}

/* WALL — immersive */
.wall-stage{position:relative;margin-top:28px;height:480px;overflow:hidden;border:1px solid rgba(170,246,230,.18);border-radius:20px;background:#080A09;touch-action:none;cursor:grab;user-select:none}
.wall-stage:active{cursor:grabbing}
.wall-world{position:absolute;left:0;top:0;width:2555px;height:1474px;transform-origin:0 0;will-change:transform;border-radius:48px;background:#121614;background-image:radial-gradient(rgba(170,246,230,.12) 1.4px,transparent 1.4px);background-size:28px 28px;box-shadow:inset 0 0 0 2px rgba(170,246,230,.22),0 30px 80px rgba(0,0,0,.6)}
.card{position:absolute;border:none;border-radius:20px;text-align:left;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-family:inherit;cursor:pointer;transition:box-shadow .2s}
.card q{font-family:'Ferryman',Georgia,serif;font-weight:800;line-height:1.16;quotes:none}
.card .meta{display:flex;flex-direction:column;gap:3px}
.card .meta b{font:700 13px/1.2 'Proxima Nova'}
.card .meta span{font:500 9px/1 'Druk Text Wide';letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.card .stk{position:absolute;top:-20px;right:-14px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));pointer-events:none}
.card.staff{border:3px solid #AAF6E6;box-shadow:0 0 0 6px rgba(170,246,230,.16),0 18px 44px rgba(0,0,0,.6);gap:16px}
.card.staff q{color:#AAF6E6}
.staff-tag{position:absolute;top:-14px;left:22px;background:#AAF6E6;color:#0C0C0A;font:800 9.5px/1 'Druk Text Wide';letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:100px}
.staff-id{display:flex;align-items:center;gap:12px;margin-top:4px}
.staff-id img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #AAF6E6;flex-shrink:0}
.staff-id span{display:flex;flex-direction:column;gap:4px}
.staff-id b{font:700 15px/1.15 'Proxima Nova'}
.staff-id i{font:500 9px/1.2 'Druk Text Wide';font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#AAF6E6}
.wsel-card.staff{border:3px solid #AAF6E6}
.wsel-card.staff q{color:#AAF6E6}
.card.is-on{box-shadow:0 0 0 4px #AAF6E6,0 18px 40px rgba(0,0,0,.6);z-index:5}
.hud{position:absolute;display:flex;align-items:center;gap:8px;z-index:6}
.hud-tl{top:12px;left:12px}
.hud-br{bottom:12px;right:12px}
.hud-pill{height:34px;padding:0 12px;border-radius:100px;background:rgba(12,12,10,.82);backdrop-filter:blur(8px);border:1px solid rgba(244,241,234,.14);display:flex;align-items:center;gap:8px;font:600 11.5px/1 'Proxima Nova';color:rgba(244,241,234,.85)}
.hud-pill b{color:#AAF6E6}
.hud button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(244,241,234,.2);background:rgba(12,12,10,.82);backdrop-filter:blur(8px);color:#F4F1EA;font-size:17px}
.hud .pct{min-width:48px;text-align:center;font:700 11.5px/1 'Proxima Nova';color:rgba(244,241,234,.8)}
.hint{display:none}
.wall-vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 18px #080A09;z-index:4;border-radius:20px}
.wsel{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.wsel-card{position:relative;border-radius:22px;padding:26px 22px 20px;display:flex;flex-direction:column;gap:14px}
.wsel-card img{position:absolute;top:-24px;right:16px;width:68px;height:68px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.wsel-card small{font:500 10px/1 'Druk Text Wide';letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.wsel-card q{font:800 28px/1.1 'Ferryman',Georgia,serif;quotes:none}
.wsel-card .who{font:700 14px/1.2 'Proxima Nova'}
.wsel-card .who span{font-weight:500;opacity:.7}
.wnav{display:flex;gap:8px}
.wnav button{flex-grow:1;height:46px;border-radius:100px;border:1px solid rgba(244,241,234,.25);background:transparent;color:#F4F1EA;font:700 12px/1 'Proxima Nova';letter-spacing:.06em;text-transform:uppercase}
@media (min-width:900px){
  .wall-stage{height:640px;margin-top:48px}
  .hint{display:flex}

  .wsel-card q{font-size:38px}
}

  <!-- TODAY VS 2028 -->
  <section class="sec bg-con" id="build"><div class="wrap">
    <div class="sec-head">
      <div><div class="k">Today vs. 2028</div><h2 class="h2 sig">Drag to see it rise.</h2></div>
      <p class="lead">Same ground, two moments. From the plan to the place where we’ll celebrate the first goal.</p>
    </div>
    <div class="cmp">
      <div class="cmp-b"></div>
      <div class="cmp-a" style="clip-path: inset(0 calc(100% - {{ posPct }}) 0 0)"></div>
      <div class="cmp-tag" style="left:12px;background:#0F3B3A;color:#AAF6E6">TODAY</div>
      <div class="cmp-tag" style="right:12px;background:#AAF6E6;color:#0F3B3A">2028</div>
      <div class="cmp-line" style="left: {{ posPct }}"></div>
      <div class="cmp-knob" style="left: {{ posPct }}">⇆</div>
      <input type="range" min="0" max="100" value="{{ pos }}" onChange="{{ onSlide }}" aria-label="Compare today and 2028">
    </div>
    <div class="note">“Today” uses the blueprint until the site photo arrives — shot from the same angle as the render.</div>
  </div></section>

  <!-- LUCA TOUR -->
  <section class="sec bg-deep on-dark" id="tour"><div class="wrap">
    <div class="sec-head">
      <div><div class="k">Tour with Luca</div><h2 class="h2 sig">Walk through your future home.</h2></div>
      <p class="lead">Pick a sector. Luca takes you there and shows you what you can do today.</p>
    </div>
    <div class="tour-grid">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="plan">
          <sc-for list="{{ sectors }}" as="s" hint-placeholder-count="6">
            <button type="button" class="pin {{ s.cls }}" style="left: {{ s.bx }}; top: {{ s.by }}" onClick="{{ s.pick }}" aria-label="{{ s.name }}">0{{ s.n }}</button>
          </sc-for>
          <img class="luca" src="assets/luca-fan-bombo.webp" alt="Luca">
          <div class="bubble">Where to? Tap a sector on the stadium and I’ll take you there!</div>
        </div>
        <div class="chips">
          <sc-for list="{{ sectors }}" as="s" hint-placeholder-count="6">
            <button type="button" class="chip {{ s.cls }}" onClick="{{ s.pick }}">0{{ s.n }} · {{ s.name }}</button>
          </sc-for>
        </div>
      </div>
      <div class="scard">
        <div class="scard-h"><span class="plate-n">0{{ selN }}</span><span style="display:flex;flex-direction:column;gap:6px"><span class="k">Sector {{ selN }} of 6</span><h3>{{ selName }}</h3></span></div>
        <p>{{ selDesc }}</p>
        <span class="tag">{{ selType }}</span>
        <a href="#tour" class="ticket"><span class="tk-a"><span>Admit one · Sector 0{{ selN }}</span><b>{{ selAction }}</b></span><span class="tk-b">GO →</span></a>
      </div>
    </div>
  </div></section>

  <!-- WALL -->
  <section class="sec bg-con" id="wall"><div class="wrap">
    <div class="sec-head">
      <div><div class="k">Community wall</div><h2 class="h2">I’m building this home for…</h2></div>
      <p class="lead">Every message will be shown at the stadium opening. Drag, zoom and open any card to read it.</p>
    </div>

    <div class="wall-stage" ref="{{ wallRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerLeave="{{ onUp }}">
      <div class="wall-world" style="{{ worldStyle }}">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="12">
          <button type="button" class="card {{ c.cls }}" style="left: {{ c.x }}px; top: {{ c.y }}px; width: {{ c.w }}px; padding: {{ c.pad }}; background: {{ c.bg }}; color: {{ c.fg }}; transform: rotate({{ c.rot }}); z-index: {{ c.z }}" onPointerDown="{{ c.grab }}" onClick="{{ c.pick }}">
            <sc-if value="{{ c.staff }}" hint-placeholder-val="{{ false }}">
              <span class="staff-tag">Club staff</span>
              <span class="staff-id"><img src="{{ c.photo }}" alt=""><span><b>{{ c.n }}</b><i>{{ c.role }}</i></span></span>
              <q style="font-size: {{ c.fs }}">{{ c.t }}</q>
            </sc-if>
            <sc-if value="{{ c.noStaff }}" hint-placeholder-val="{{ true }}">
              <img class="stk" src="{{ c.stk }}" alt="" style="width: {{ c.sw }}; height: {{ c.sw }}">
              <q style="font-size: {{ c.fs }}">{{ c.t }}</q>
              <span class="meta"><b>— {{ c.n }}</b><span>{{ c.b }}</span></span>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div class="wall-vig"></div>
      <div class="hud hud-tl"><span class="hud-pill"><b>{{ count }}</b> messages</span><span class="hud-pill hint">Drag the wall or the cards · Scroll to zoom · Tap to read</span></div>
      <div class="hud hud-br">
        <button type="button" onClick="{{ zoomOut }}" aria-label="Zoom out">−</button>
        <span class="hud-pill pct">{{ zoomPct }}</span>
        <button type="button" onClick="{{ zoomIn }}" aria-label="Zoom in">+</button>
        <button type="button" onClick="{{ reset }}" aria-label="See the whole wall">⤢</button>
      </div>
    </div>
    <div class="wall-bottom2">
      <div class="wsel">
        <div class="{{ smCls }}" style="background: {{ smBg }}; color: {{ smFg }}">
          <sc-if value="{{ smStaff }}" hint-placeholder-val="{{ false }}"><img src="{{ smPhoto }}" alt=""></sc-if>
          <sc-if value="{{ smNoStaff }}" hint-placeholder-val="{{ true }}"><img src="{{ smStk }}" alt=""></sc-if>
          <small>I’m building this home for…</small>
          <q>{{ smText }}</q>
          <div class="who">— {{ smName }} <span>· {{ smBadge }}</span></div>
        </div>
        <div class="wnav"><button type="button" onClick="{{ prev }}">← Previous</button><button type="button" onClick="{{ surprise }}">Surprise me</button><button type="button" onClick="{{ next }}">Next →</button></div>
      </div>
      <div class="wall-foot">
        <a href="#wall" class="btn btn-aq">Leave your message</a>
        <div class="flag">Every message will be displayed at the stadium’s opening day.</div>
      </div>
    </div>

  </div></section>

      menuOpen: st.menu, menuIcon: st.menu ? '✕' : '☰', toggleMenu: () => this.setState({ menu: !st.menu }),
      langEN: st.lang === 'EN' ? 'is-on' : '', langES: st.lang === 'ES' ? 'is-on' : '',
      setEN: () => this.setState({ lang: 'EN' }), setES: () => this.setState({ lang: 'ES' })
    };
  }
}


(function(){
  var tpl = document.getElementById('dc-tpl'), root = document.getElementById('app');
  var comp = new Component();
  var H = {}, R = {}, hid = 0;
  var EVMAP = { onClick:'click', onChange:'input', onInput:'input', onPointerDown:'pointerdown', onPointerMove:'pointermove', onPointerUp:'pointerup', onPointerLeave:'pointerleave' };
  function look(sc, p){ p = p.trim(); if (p === 'true') return true; if (p === 'false') return false; return p.split('.').reduce(function(o,k){ return o == null ? undefined : o[k]; }, sc); }
  function sub(str, sc){ return str.replace(/\{\{(.*?)\}\}/g, function(m,p){ var v = look(sc,p); return (typeof v === 'function' || v == null) ? '' : v; }); }
  function rend(node, sc, parent, svg){
    if (node.nodeType === 3){ parent.appendChild(document.createTextNode(sub(node.textContent, sc))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-for'){ var m = node.getAttribute('list').match(/\{\{(.*?)\}\}/); var list = look(sc, m[1]) || []; var as = node.getAttribute('as');
      list.forEach(function(it, i){ var s2 = Object.assign({}, sc); s2[as] = it; s2.$index = i; node.childNodes.forEach(function(ch){ rend(ch, s2, parent, svg); }); }); return; }
    if (tag === 'sc-if'){ var m2 = node.getAttribute('value').match(/\{\{(.*?)\}\}/); if (look(sc, m2[1])) node.childNodes.forEach(function(ch){ rend(ch, sc, parent, svg); }); return; }
    var isSvg = svg || tag === 'svg';
    var el = isSvg ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : document.createElement(tag);
    for (var a of node.attributes){
      var n = a.name;
      var ev = Object.keys(EVMAP).find(function(k){ return k.toLowerCase() === n.toLowerCase(); });
      if (ev){ var mm = a.value.match(/\{\{(.*?)\}\}/); var fn = mm && look(sc, mm[1]); if (typeof fn === 'function'){ var id = 'h' + (hid++); H[id] = fn; el.setAttribute('data-ev-' + EVMAP[ev], id); } continue; }
      if (n === 'ref'){ var mr = a.value.match(/\{\{(.*?)\}\}/); var rf = mr && look(sc, mr[1]); if (typeof rf === 'function'){ var rid = 'r' + (hid++); R[rid] = rf; el.setAttribute('data-ref', rid); } continue; }
      if (n.indexOf('hint-') === 0) continue;
      el.setAttribute(n, sub(a.value, sc));
    }
    (node.content || node).childNodes.forEach(function(ch){ rend(ch, sc, el, isSvg); });
    parent.appendChild(el);
  }
  var first = true, queued = false;
  function render(){
    queued = false; H = {}; R = {}; hid = 0;
    var vals = comp.renderVals();
    var next = document.createElement('div');
    tpl.content.childNodes.forEach(function(ch){ rend(ch, vals, next); });
    if (first || !window.morphdom){ root.innerHTML = ''; while (next.firstChild) root.appendChild(next.firstChild); }
    else { morphdom(root, next, { childrenOnly: true, onBeforeElUpdated: function(f, t){ return !f.isEqualNode(t); } }); }
    root.querySelectorAll('[data-ev-pointerleave]').forEach(function(el){ if (!el.__pl){ el.__pl = true; el.addEventListener('pointerleave', function(e){ var f = H[el.getAttribute('data-ev-pointerleave')]; if (f) f(e); }); } });
    root.querySelectorAll('[data-ref]').forEach(function(el){ var f = R[el.getAttribute('data-ref')]; if (f) f(el); });
    if (first){ first = false; if (comp.componentDidMount) comp.componentDidMount(); }
  }
  window.scheduleRender = function(){ if (!queued){ queued = true; requestAnimationFrame(render); } };
  ['click', 'input', 'pointerdown', 'pointermove', 'pointerup'].forEach(function(type){
    root.addEventListener(type, function(e){
      var el = e.target;
      while (el && el !== root){
        if (el.getAttribute){ var id = el.getAttribute('data-ev-' + type); if (id && H[id]){ H[id](e); if (e.cancelBubble) break; } }
        el = el.parentNode;
      }
    });
  });
  render();
})();

// ---------- postcards overlay
(function(){
  var host = document.getElementById('postales-host');
  var sh = host.attachShadow({ mode: 'open' });
  sh.innerHTML = '<style>' + document.getElementById('pz-css').textContent + '</style>' + document.getElementById('pz-tpl').innerHTML;
  var ov = sh.querySelector('.ov'), last = null;
  function fit(){
    sh.querySelectorAll('.scw').forEach(function(w){
      var base = +w.getAttribute('data-w'), inner = w.firstElementChild, s = Math.min(1, w.clientWidth / base);
      inner.style.transform = 'scale(' + s + ')'; w.style.height = (inner.offsetHeight * s) + 'px';
    });
  }
  function open(){ last = document.activeElement; host.hidden = false; document.documentElement.style.overflow = 'hidden'; ov.scrollTop = 0; fit(); sh.querySelector('[data-close]').focus(); }
  function close(){ host.hidden = true; document.documentElement.style.overflow = ''; if (last && last.focus) last.focus(); }
  sh.querySelector('[data-close]').addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !host.hidden) close(); });
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href="#postales"]');
    if (a){ e.preventDefault(); open(); }
  });
  window.addEventListener('resize', function(){ if (!host.hidden) fit(); });
  if (location.hash === '#postales') open();
})();
</script>
